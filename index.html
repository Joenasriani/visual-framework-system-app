<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="description" content="Build, run and inspect visual AI workflows." />
  <title>Visual Framework</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="Visual Framework">
        <span class="brand-mark">VF</span><span class="brand-name">Visual Framework</span>
      </div>
      <div class="top-actions">
        <span id="status" class="status"><i></i><b>READY</b></span>
        <button id="reset" class="text-btn hide-mobile">Reset</button>
        <button id="run" class="run-btn"><span>Run</span><kbd>⌘R</kbd></button>
      </div>
    </header>

    <aside class="tool-rail" aria-label="Add to workflow">
      <div class="tool-caption">ADD</div>
      <button class="tool" data-add="asset" title="Add data"><span class="tool-glyph">◆</span><span class="tool-label">Data</span><span class="tool-key">1</span></button>
      <button class="tool" data-add="instruction" title="Add step"><span class="tool-glyph">→</span><span class="tool-label">Step</span><span class="tool-key">2</span></button>
      <button class="tool" data-add="expression" title="Add logic"><span class="tool-glyph">ƒ</span><span class="tool-label">Logic</span><span class="tool-key">3</span></button>
      <button class="tool" data-add="check" title="Add check"><span class="tool-glyph">✓</span><span class="tool-label">Check</span><span class="tool-key">4</span></button>
      <button class="tool" data-add="output" title="Add result"><span class="tool-glyph">□</span><span class="tool-label">Result</span><span class="tool-key">5</span></button>
    </aside>

    <section class="workspace">
      <div class="workspace-head">
        <div><strong>Workflow</strong><span id="count"></span></div>
        <div class="zoom" aria-label="Zoom"><button id="zoom-out" title="Zoom out">−</button><span id="zoom-label">100%</span><button id="zoom-in" title="Zoom in">+</button></div>
      </div>
      <div id="stage" class="stage">
        <div id="world" class="world">
          <svg id="edges" class="edges" aria-hidden="true"></svg>
          <div id="nodes"></div>
        </div>
      </div>
    </section>

    <aside id="inspector" class="inspector"></aside>
    <div id="run-strip" class="run-strip" hidden></div>
  </main>
  <script src="./engine.js"></script>
  <script src="./app-core.js"></script>
  <script src="./app-render.js"></script>
  <script src="./app-events.js"></script>
</body>
</html>
