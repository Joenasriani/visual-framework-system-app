name: Final MVP v1 Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'e2e/complete.mjs'
      - 'e2e/final.mjs'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/final-mvp-pr.yml'
  workflow_dispatch:

jobs:
  final-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/visual-framework-preview.log 2>&1 &
          echo $! > /tmp/visual-framework-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/visual-framework-preview.log
          exit 1
      - name: Verify accepted MVP contract
        run: node e2e/complete.mjs
        env:
          LIVE_URL: http://127.0.0.1:4173
      - name: Verify final MVP completion pass
        run: node e2e/final.mjs
        env:
          LIVE_URL: http://127.0.0.1:4173
      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/visual-framework-preview.log || true
