name: Repair Final Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-final-acceptance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair connection acceptance section
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/final.mjs')
          text = path.read_text()
          start = text.index('  // Compatible execution connection creation, Undo and Redo.')
          end = text.index('  // Semantic relation and hierarchy are reversible.', start)
          replacement = '''  // Compatible execution connection creation, Undo and Redo.
  const executionBeforeConnect = await executionLinks();
  await page.getByRole('button', { name: /Step/ }).first().click();
  const newStep = page.locator('.frame-instruction').last();
  await dragLocator(page.locator('[data-frame="asset-1"] [data-port="out"]'), newStep.locator('[data-port="in"]'));
  assert(await executionLinks() === executionBeforeConnect + 1, 'Compatible port connection failed');
  await page.keyboard.press('Control+z');
  await sleep(100);
  assert(await executionLinks() === executionBeforeConnect, 'Undo connection failed');
  await page.keyboard.press('Control+Shift+z');
  await sleep(100);
  assert(await executionLinks() === executionBeforeConnect + 1, 'Redo connection failed');
  await page.keyboard.press('Control+z');
  await page.keyboard.press('Control+z');

  // Incompatible port must not connect.
  await page.getByRole('button', { name: /Check/ }).first().click();
  const newCheck = page.locator('.frame-check').last();
  const beforeReject = await executionLinks();
  await dragLocator(newCheck.locator('[data-port="out"]'), page.locator('[data-frame="expression-1"] [data-port="in"]'));
  assert(await executionLinks() === beforeReject, 'Incompatible connection was accepted');
  await page.keyboard.press('Control+z');

'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - run: node --check e2e/final.mjs
      - name: Commit verified acceptance repair
        run: |
          git config user.name "Visual Framework CI"
          git config user.email "actions@users.noreply.github.com"
          git add e2e/final.mjs
          git commit -m "Verify cable acceptance against live graph state"
          git push origin HEAD:main
