name: Live MVP Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'e2e/live.mjs'
      - '.github/workflows/live-mvp.yml'

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node e2e/live.mjs
        env:
          LIVE_URL: https://visual-framework-app.vercel.app
