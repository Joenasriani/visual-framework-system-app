name: Production MVP Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'public/**'
      - 'e2e/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - '.github/workflows/live-mvp.yml'

permissions:
  contents: read

concurrency:
  group: production-mvp-acceptance
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Wait for canonical deployment to match this commit
        env:
          LIVE_URL: https://visual-framework-app.vercel.app
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in {1..60}; do
            body="$(curl --fail --silent --max-time 10 "$LIVE_URL/api/build-info" || true)"
            if printf '%s' "$body" | grep -Fq "$EXPECTED_SHA"; then
              echo "Canonical deployment matches $EXPECTED_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Canonical deployment never reported expected commit $EXPECTED_SHA"
          curl --silent "$LIVE_URL/api/build-info" || true
          exit 1
      - run: node e2e/live.mjs
        env:
          LIVE_URL: https://visual-framework-app.vercel.app
      - run: node e2e/complete.mjs
        env:
          LIVE_URL: https://visual-framework-app.vercel.app
