name: Fix Multi Selection Drag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-multidrag.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve selected group during drag
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          old = "    else if (!additive && selection.length > 1) selection = [frame.id];\n"
          if old not in text:
              raise SystemExit('Expected multi selection collapse line was not found')
          path.write_text(text.replace(old, '', 1))
          PY
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name "Visual Framework CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Preserve multi selection while dragging"
          git push origin HEAD:main
